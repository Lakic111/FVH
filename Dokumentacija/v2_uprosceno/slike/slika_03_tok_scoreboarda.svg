<svg xmlns="http://www.w3.org/2000/svg" class="fig-sans" viewBox="0 0 720 380" width="720" height="380" font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="720" height="380" fill="#fff"/><defs><marker id="strelica" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="strelica_poc" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#000"/></marker></defs><rect x="260" y="10" width="200" height="36" rx="3" fill="#e9e9e9" stroke="#000" stroke-width="1"/><text x="360.0" y="32.0" font-size="11" font-weight="normal" text-anchor="middle">transakcija iz monitora</text><polyline points="360,46 360,66" fill="none" stroke="#000" stroke-width="1.1" marker-end="url(#strelica)"/><rect x="300" y="66" width="120" height="30" rx="3" fill="#ffffff" stroke="#000" stroke-width="1"/><text x="360.0" y="85.0" font-size="11" font-weight="normal" text-anchor="middle">S00 ili S01?</text><polyline points="300,81 170,81 170,110" fill="none" stroke="#000" stroke-width="1.1" marker-end="url(#strelica)"/><text x="230" y="75" font-size="10" text-anchor="middle" font-weight="normal" fill="#000">S00</text><polyline points="420,81 550,81 550,110" fill="none" stroke="#000" stroke-width="1.1" marker-end="url(#strelica)"/><text x="490" y="75" font-size="10" text-anchor="middle" font-weight="normal" fill="#000">S01</text><rect x="40" y="110" width="260" height="44" rx="3" fill="#ffffff" stroke="#000" stroke-width="1"/><text x="170.0" y="129.1" font-size="11" font-weight="normal" text-anchor="middle">upis u IMG_W, IMG_H, TMP_W, TMP_H</text><text x="170.0" y="142.8" font-size="11" font-weight="normal" text-anchor="middle">→ zapamti dimenzije</text><rect x="40" y="166" width="260" height="44" rx="3" fill="#ffffff" stroke="#000" stroke-width="1"/><text x="170.0" y="185.1" font-size="11" font-weight="normal" text-anchor="middle">čitanje STATUS</text><text x="170.0" y="198.8" font-size="11" font-weight="normal" text-anchor="middle">→ zapamti busy i done</text><rect x="40" y="222" width="260" height="56" rx="3" fill="#ffffff" stroke="#000" stroke-width="1"/><text x="170.0" y="240.2" font-size="11" font-weight="normal" text-anchor="middle">upis 1 u CTRL</text><text x="170.0" y="254.0" font-size="11" font-weight="normal" text-anchor="middle">jezgro zauzeto → zanemari (jezgro ignoriše)</text><text x="170.0" y="267.7" font-size="11" font-weight="normal" text-anchor="middle">inače → predict()</text><rect x="40" y="300" width="260" height="56" rx="3" fill="#f2f2f2" stroke="#000" stroke-width="1"/><text x="170.0" y="325.1" font-size="11" font-weight="normal" text-anchor="middle">predict(): ncc_model(senka, dimenzije)</text><text x="170.0" y="338.8" font-size="11" font-weight="normal" text-anchor="middle">→ očekivana mapa rezultata</text><polyline points="170,278 170,300" fill="none" stroke="#000" stroke-width="1.1" marker-end="url(#strelica)"/><rect x="420" y="110" width="260" height="56" rx="3" fill="#ffffff" stroke="#000" stroke-width="1"/><text x="550.0" y="128.2" font-size="11" font-weight="normal" text-anchor="middle">upis u sliku ili šablon</text><text x="550.0" y="142.0" font-size="11" font-weight="normal" text-anchor="middle">(samo ako je WSTRB[0] = 1)</text><text x="550.0" y="155.7" font-size="11" font-weight="normal" text-anchor="middle">→ senka memorije</text><rect x="420" y="190" width="260" height="44" rx="3" fill="#ffffff" stroke="#000" stroke-width="1"/><text x="550.0" y="209.1" font-size="11" font-weight="normal" text-anchor="middle">upis u oblast rezultata</text><text x="550.0" y="222.8" font-size="11" font-weight="normal" text-anchor="middle">→ zanemaruje se (samo čitanje)</text><rect x="420" y="258" width="260" height="56" rx="3" fill="#ffffff" stroke="#000" stroke-width="1"/><text x="550.0" y="283.1" font-size="11" font-weight="normal" text-anchor="middle">čitanje oblasti rezultata</text><text x="550.0" y="296.8" font-size="11" font-weight="normal" text-anchor="middle">→ compare(): svaka reč sa očekivanom</text><rect x="470" y="334" width="160" height="30" rx="3" fill="#f2f2f2" stroke="#000" stroke-width="1"/><text x="550.0" y="353.0" font-size="11" font-weight="normal" text-anchor="middle">greška ili poklapanje</text><polyline points="550,314 550,334" fill="none" stroke="#000" stroke-width="1.1" marker-end="url(#strelica)"/><polyline points="420,138 360,138 360,328 300,328" fill="none" stroke="#000" stroke-width="1.1" marker-end="url(#strelica)" stroke-dasharray="5,3"/><text x="366" y="230" font-size="10" text-anchor="start" font-weight="normal" fill="#000">senka</text><polyline points="300,349 470,349" fill="none" stroke="#000" stroke-width="1.1" marker-end="url(#strelica)" stroke-dasharray="5,3"/><text x="385" y="343" font-size="10" text-anchor="middle" font-weight="normal" fill="#000">očekivana mapa</text></svg>